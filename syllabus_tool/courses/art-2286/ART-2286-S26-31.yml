  catalog_description: |
    This course emphasizes artificial photographic lighting as a creative and practical means to create images for artistic and commercial purposes. Studio, strobe, and off-camera flash will be introduced to photograph a variety of subject matter including: still life, portraiture, tabletop, and on-location environments. Media presentations, video tutorials, discussions, and studio critiques will address photographic technique, theory and history, interpretation and analysis. Students will work in groups in the photo studio to produce work throughout the semester. # REQUIRED – from CCO
  prerequisites: ART 1184
  major_content_outline: |
    1. Theory and History of Artificial Light in Photography
    2. Fine Art and Commercial Applications of Composing Photographic Images with Light
    3. Techniques for Working with Artificial Light
    4. Professionalism in a Lighting Studio
  course_learning_outcomes: |
    1. Apply an aesthetically effective use of light in the creation and presentation of photographic images using
      artificial light with a variety of subject matter and styles.
    2. Demonstrate fundamental photographic and digital skills with a variety of artificial lighting systems, set ups
      and digital imaging software.
    3. Articulate an informed personal reaction to photographs through critique.
    4. Identify how light has been used in contemporary and historic art and photography, as it applies to making
      photographic images.
    5. Critically select and prepare a portfolio of quality digital prints using the principles and techniques of artificial
      lighting.

  am_i_ready: |
    The only prerequisite for this course is successful completion of ART 1184. Students enter this course with a wide range of experience levels, technical comfort, and confidence, and that is expected. This course is designed for growth. No one is expected to have everything figured out on the first day, and progress over the semester matters more than where you begin. Planning, consistent work, and clear communication are far more important than any idea of innate talent.
  how_course_works: |
    This is an art studio course that emphasizes the active production of photographic images using artificial light sources. Learning in this course happens through making photographs, not just reading or watching demonstrations. Regular attendance and consistent time spent working in the lighting studio are essential. You should expect to make photographs every week. Assignments may overlap, and many projects will require collaboration with classmates. If you are struggling, confused, or falling behind, ask early. Seeking clarification and support is a sign of professionalism, not failure.

  mntc_goals:
    - "This course meets no MnTC goals."
  rctc_core_outcomes:
