  what_matters_grade: |
    The first priority of this course is assembling an exhibition portfolio with an artist statement, resume, and documentation of your artwork. That is where the bulk of the points are found. Be prepared by doing research and discussions. We will meet in class and one on one to look at your artwork. If you show up, are prepared, and participate, you will get the points. There are a couple of other activities related to art professional practices that will make sense when we get to them.
