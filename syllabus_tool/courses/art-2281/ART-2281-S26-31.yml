  classroom: East Hall 265 # OPTIONAL for fully online; REQUIRED otherwise

  catalog_description: |
    This course prepares students for future study or careers in the fields of Art and Design. Students will develop a personal portfolio of art or design work, prepare supplementary materials including but not limited to a resume and art statement, and complete a digital portfolio of their work. History lectures will focus on major themes in the History of Photography, while students will research and present on artists of influence related to their own work in their chosen field. This course emphasizes principles of professionalism to prepare students for their future artistic endeavors. Students should have taken at least one college level studio art course before taking this course.
  prerequisites: "None"
  major_content_outline: |
    1. Portfolio development
    2. Professional practices
      - Resume
      - Artist statement
      - Professionalism in the Arts
      - Basic digital skills for Arts careers
    3. Historical and contemporary art themes
      - Major themes in the History of Photography
      - Contemporary art Practice
      - Artists of influence research
    4. Portfolio Presentation
      - Exhibition
      - Digital portfolio
      - Oral Presentation
      - Documentation of artwork

  course_learning_outcomes: |
    1. Create a portfolio that demonstrates aesthetic growth by achieving core technical and conceptual proficiencies.
    2. Practice professionalism through the creation of supplementary materials such as resume, artist statement, etc.
    3. Conduct and present independent research to support future growth within the fields of Art and Design.
    4. Articulate the effectiveness of personal artwork, the work of others, and the cultural value of the Arts through critique and oral presentation.

  am_i_ready: |
    The only prerequisite for this course is a desire to prepare your artwork for professional presentation. Ideally, you would have at least one college studio art course completed before you take the course, but that is a suggestion and not a requirement. Students enter this course with a wide range of experience levels, technical comfort, and confidence, and that is expected. This course is designed for growth. No one is expected to have everything figured out on the first day, and progress over the semester matters more than where you begin. Planning, consistent work, and clear communication are far more important than any idea of innate talent.
  how_course_works: |
    This course emphasizes the organization of your artwork into a professional presentation with high quality documentation of the work, an artist's statement, a professional resume, and other materials. By the end of the semester, the class will ask you to research and submit your portfolio materials to applications for three to five professional art opportunities. We will also produce a book with artwork and course materials from students in the course as a kind of exhibition catalog. This looks overwhelming right now, but we will emphasize learning and growth. If you are overwhelmed, prioritize the work and its documentation. Everything else exists to help that succeed.

  mntc_goals: "This course meets no MnTC goals."
  rctc_core_outcomes:
    - Critical Thinking

