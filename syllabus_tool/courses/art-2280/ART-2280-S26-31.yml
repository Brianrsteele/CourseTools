  catalog_description: |
    This course expands on skills covered in ART 1184. Instruction will include digital photography best practices, the fine digital print, and the creation of an extended body of related images. Assignments will direct students toward personal expression in digital photography. Media presentations, discussion, and studio critiques will address photographic theory and history, interpretation and analysis.
  prerequisites: "ART 1184"
  major_content_outline: |
    1. Contemporary photographers and photographic theory
    2. Digital photography best practices
    3. The fine print
    4. Creating an extended body of work collected in a photographic portfolio
  course_learning_outcomes: |
    1. Capture, process and manipulate digital photographs using contemporary best practices.
    2. Create fine photographic prints using digital output technologies, culminating in an extended body of expressive photographic work related to a single theme or idea of personal significance.
    3. Articulate an informed personal reaction to photographs through critique.
    4. Identify important contemporary and historical art photographers, articulate contemporary concerns in art photography and current events regarding photography.

  am_i_ready: |
    The only prerequisite for this course is successful completion of ART 1184. Students enter this course with a wide range of experience levels, technical comfort, and confidence, and that is expected. This course is designed for growth. No one is expected to have everything figured out on the first day, and progress over the semester matters more than where you begin. Planning, consistent work, and clear communication are far more important than any idea of innate talent.
  how_course_works: |
    This course functions as an active photography studio. The focus is on applying current digital photography best practices to create, refine, and print an extended body of expressive photographic work. You will learn by making photographs regularly, evaluating results, and revising your approach over time. Expect weekly image-making, overlapping assignments, and structured critique. Printing is a core part of the course, not an afterthought, and don't be surprised if it takes a lot longer than you expect. Starting early on projects, especially printing, is a good idea. If something isn’t working or you begin to fall behind, address it early. Communicating questions and seeking feedback is a professional habit, not a sign of failure.
  mntc_goals: "This course meets no MnTC goals."
  rctc_core_outcomes:
    - Critical Thinking

