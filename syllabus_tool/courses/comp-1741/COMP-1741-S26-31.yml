  catalog_description: |
    This course introduces client-side scripting. Students will explore HTML and CSS, dynamic client-side scripting using JavaScript, client-side error checking and validation, and asynchronous server interaction. Students will construct and evaluate various client-side interactions. College level reading is required.
  prerequisites: "MATH 0099"
  major_content_outline: |
    1. Fundamental of the web
    2. Client-side dynamic HTML, CSS, and JavaScript
    3. HTML form processing error checking

  course_learning_outcomes: |
    The student will be able to:
    1. Implement dynamic HTML, CSS with Client-Side Scripting using JavaScript.
    2. Define the terms and methods client-side scripting regarding user interaction.
    3. Develop client-side scripts that interact with web applications and dynamically update content.
    4. Perform client-side error checking and validation for graceful failure.

  am_i_ready: |
    To take this course, you must have passed MATH 0099 or tested out of it, and you should be comfortable with college-level reading, including following written instructions and technical explanations.

    No previous coding or programming experience is expected. This course is designed for beginners, and JavaScript is a welcoming language for new programmers because you can experiment, make mistakes, and see results quickly.

    If you already have programming experience, this course is still valuable. JavaScript is one of the most widely used languages today and is an important skill for anyone interested in modern web development.

    If you meet the math requirement and are willing to read carefully and practice regularly, you are ready for this course.
  how_course_works: |
    This is an online course with no scheduled meeting times. Each week, you will read assigned material, watch short videos when provided, and complete hands-on coding assignments. Most of the work is practical: you learn by writing code, testing it, and fixing it.

    There are two major exams during the semester, a mid-term and final worth 45% of your grade (and an easy third exam to get acquainted with Respondus worth 5% of your grade). These are based on the readings, videos, and assignments and are meant to check your understanding of the core ideas, not trick you.

    Assignments are due every Sunday at 11:59 p.m. and build on each other, so staying on pace matters. You are expected to work independently, but you are encouraged to ask questions, use course resources, and reach out early if you get stuck. The goal is steady progress, not perfection—learning to think through problems is more important than getting everything right the first time.

  mntc_goals: "This course meets no MnTC goals."
  rctc_core_outcomes:
    - Critical Thinking

