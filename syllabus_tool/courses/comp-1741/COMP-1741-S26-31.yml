  what_matters_grade: |
    A large portion of the grade is the midterm and final. They will not be cumulative. The projects are the next most important part of the grade. They are intended to help prepare you for the exams, and so they are more important than they look. Discussion questions will be worth about two letter grades, and they are worth completing. Finally, I have assigned about half a letter grade to the readings. It becomes pretty obvious to me when I grade work who is doing the reading and who isn't, think of that as a participation grade.
