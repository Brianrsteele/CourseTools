# 05_institutional_F26.yml
# File for institutional-level term dates.
# This file contains ONLY registrar-defined and campus-wide calendar facts.
# All courses reference this file using `term_ref: "TERM"`.

metadata:
  version: 1.0
  created_by: "Brian Steele"
  created_on: 2026-08-01
  comments: >
    Institutional calendar for term. This file is the source of truth for all
    campus-wide dates: start/end of term, drop/withdraw deadlines, holidays,
    closures, and institutional constraints. Individual courses must NOT add
    their own dates here.

term_id: "F26" # e.g. "F25" or "S26"
label: "Fall 2026" # e.g. "Fall 2025"

institutional_dates:
  # -----------------------------------------------------------
  # Core term dates — pulled directly from Registrar.
  # -----------------------------------------------------------
  start_date: 2026-08-24 # First day of instruction campus-wide
  end_date: 2026-12-18 # Last day of classes campus-wide

  last_day_to_drop_full_term: 2026-08-28 # Registrar-defined
  last_day_to_withdraw_full_term: 2026-11-25 # Registrar-defined - https://www.rctc.edu/eservices/registration/registration-deadlines/

  # -----------------------------------------------------------
  # No-class days and campus closures
  # Use `date:` for single days, or `date_range:` for multi-day closures.
  # -----------------------------------------------------------
  holidays_and_closures:
    - kind: institutional_event
      date: 2026-09-07
      label: "Labor Day Holiday"
    - kind: institutional_event
      date: 2026-09-16
      label: "Faculty Development Day"
    - kind: institutional_event
      date: 2026-10-06
      label: "Student Success Day"
    - kind: institutional_event
      subkind: educatation_minnesota
      date_range:
        start: 2026-10-15
        end: 2026-10-16
      label: "Education Minnesota Conference - No Classes"
    - kind: institutional_event
      date: 2026-11-11
      label: "Veterans Day Holiday"
    - kind: institutional_event
      subkind: thanksgiving_break
      date_range:
        start: 2026-11-26
        end: 2026-11-27
      label: "Thanksgiving Break - No Classes"

    # -----------------------------------------------------------
    # Days when classes meet but additional rules apply.
    # Example: "General Election – No campus events 6–8pm"
    # -----------------------------------------------------------
    - kind: institutional_event
      date: 2026-11-03
      label: "General Election - No RCTC Events from 6 - 8 p.m."
